name: Publish patched SafeBucket image

on:
  workflow_dispatch:
  push:
    branches:
      - fix/direct-large-downloads
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - "**/*.go"
      - "web/**"
      - ".github/workflows/publish-patched-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-patched-safebucket
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safebucket:0.7.2-direct-download
            ghcr.io/${{ github.repository_owner }}/safebucket:direct-large-downloads
          cache-from: type=gha
          cache-to: type=gha,mode=max
